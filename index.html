<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiota Scapes">
<meta name="theme-color" content="#4f9a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fiota Scapes</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#3f8a3a}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;color:#3a2a1a;position:fixed;inset:0}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.btn{background:linear-gradient(#ffd65a,#f5a623);color:#5a3200;font-weight:800;font-size:18px;padding:12px 22px;border-radius:18px;box-shadow:0 5px 0 #c27a00,0 8px 14px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c27a00}
.btn.green{background:linear-gradient(#8fe066,#4caf3a);color:#fff;box-shadow:0 5px 0 #2e7a22,0 8px 14px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#7cc8ff,#3a8fe0);color:#fff;box-shadow:0 5px 0 #2263a8,0 8px 14px rgba(0,0,0,.25)}
.btn.gray{background:linear-gradient(#f0ebe0,#d6cfc0);color:#5a4a3a;box-shadow:0 5px 0 #a89e8a}
.btn.small{font-size:15px;padding:8px 14px;border-radius:14px}
.btn:disabled{filter:grayscale(.8);opacity:.6}
.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;display:grid;place-items:center}

/* TITULO */
#title{background:radial-gradient(circle at 50% 30%,#bff0a8,#5aa245 70%,#3f8a3a);align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 20px) 20px 30px}
#title h1{margin:0;font-size:52px;line-height:.95;text-align:center;color:#fff;letter-spacing:-1px;text-shadow:0 4px 0 #2e7a22,0 8px 18px rgba(0,0,0,.3)}
#title h1 span{display:block;font-size:34px;color:#ffe066;text-shadow:0 3px 0 #c27a00,0 6px 14px rgba(0,0,0,.3)}
.trio{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.trio .pt{width:110px;height:110px;border-radius:50%;background:#fff8e8;border:4px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.25);overflow:hidden}
.trio .pt.big{width:136px;height:136px;margin:0 -10px;z-index:2}
.trio .pt svg{width:100%;height:100%;display:block}
.trio .pt.fio{background:#ffe9b8}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-6px)}}
#title .sub{color:#fff;font-weight:700;opacity:.9;text-align:center}

/* JARDIM */
#garden{background:linear-gradient(#bfe6ff 0 30%,#6db34e 30%)}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;z-index:3}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.pill .ic{font-size:22px}
.grow{flex:1}
#scene{flex:1;position:relative;min-height:0}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
.bottombar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.25));z-index:3}
.bottombar .play{flex:1;font-size:21px;padding:14px 10px}
.side{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);gap:3px}
.badge{position:absolute;top:-4px;right:-4px;background:#e8402a;color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;border:2px solid #fff}
.relative{position:relative}
.marker .pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18)}}
.item{cursor:pointer}
.glow{animation:glow 1.6s ease-in-out infinite alternate}
.glow:nth-of-type(3n){animation-delay:.5s}.glow:nth-of-type(3n+1){animation-delay:1s}
@keyframes glow{to{opacity:.45}}
.spray{animation:spray .8s ease-in-out infinite alternate}
@keyframes spray{to{opacity:.55;transform:translateY(1px)}}
.ripple{animation:ripple 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
.swing{animation:swing 2.4s ease-in-out infinite;transform-origin:66px 406px}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.smoke{animation:smoke 2.5s ease-in-out infinite}
@keyframes smoke{0%{transform:translateY(6px);opacity:0}30%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
.ember circle{animation:glow .5s ease-in-out infinite alternate}
#fiotaSprite{cursor:pointer}
#fiotaSprite .bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.built{animation:built .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes built{from{opacity:0;transform:translateY(-14px)}}
.sparkle{position:absolute;pointer-events:none;font-size:26px;animation:spark 1s ease-out forwards;z-index:5}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* MODAIS */
.overlay{position:absolute;inset:0;background:rgba(20,30,10,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.overlay.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:#fff8e8;border-radius:26px;padding:20px 18px;width:100%;max-width:400px;max-height:88vh;overflow:auto;box-shadow:0 10px 0 #d9c9a3,0 20px 40px rgba(0,0,0,.4);border:4px solid #fff;text-align:center;animation:popin .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 10px;font-size:26px;color:#4a7a2a}
.card p{margin:6px 0;font-size:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tasklist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.task{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #e6d9b8;text-align:left}
.task .nm{flex:1;font-weight:800;font-size:16px}
.task .done{color:#4caf3a;font-weight:800}
.prog{height:12px;background:#e6d9b8;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8fe066,#4caf3a)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.styl{background:#fff;border-radius:16px;padding:6px;border:3px solid transparent;box-shadow:0 3px 0 #e6d9b8;font-weight:800;font-size:13px}
.styl.sel{border-color:#4caf3a}
.styl svg{width:100%;aspect-ratio:1;display:block;background:#8fcf6a;border-radius:10px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shop .it{background:#fff;border-radius:16px;padding:10px 6px;box-shadow:0 3px 0 #e6d9b8;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:800;font-size:14px}
.shop .em{font-size:28px}
.bigfiota{width:150px;height:150px;margin:0 auto;border-radius:50%;background:#ffe9b8;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2);overflow:hidden}
.bigfiota svg{width:100%;height:100%}
input[type=text]{font-family:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid #e6d9b8;width:100%;text-align:center;font-weight:700;-webkit-user-select:text;user-select:text;background:#fff;color:#3a2a1a}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-top:10px}
.small-note{font-size:13px;opacity:.75;text-align:left;line-height:1.4}

/* DIALOGO */
#dialog{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;background:linear-gradient(rgba(0,0,0,0) 40%,rgba(0,0,0,.45))}
#dialog.on{display:flex}
.dbox{position:relative;margin:0 10px calc(env(safe-area-inset-bottom) + 14px);width:100%;background:#fff8e8;border-radius:24px;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:16px 16px 18px 128px;min-height:118px;animation:popin .25s cubic-bezier(.3,1.5,.5,1)}
.dbox .who{position:absolute;left:8px;bottom:12px;width:112px;height:112px;border-radius:50%;background:#ffe9b8;border:4px solid #fff;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.dbox .who svg{width:100%;height:100%}
.dbox .nm{display:inline-block;font-weight:900;color:#fff;padding:3px 12px;border-radius:999px;font-size:15px;margin-bottom:6px}
.dbox .tx{font-size:18px;font-weight:700;line-height:1.3}
.dbox .nx{position:absolute;right:14px;bottom:8px;font-size:13px;opacity:.55;font-weight:800}

/* JOGO */
#game{background:linear-gradient(#8fd06c,#4f9a3a)}
.hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px}
.goals{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.goal{background:rgba(255,255,255,.93);border-radius:16px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .15s}
.goal .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.goal.ok{background:#d9f7c9}
.goal.hit{transform:scale(1.15)}
.lvl{background:#fff;border-radius:14px;padding:4px 10px;font-weight:900;text-align:center;line-height:1.05;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lvl b{font-size:20px;display:block;color:#4a7a2a}
.infobar{display:flex;justify-content:center;gap:8px;padding:0 10px 8px;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.infobar span{background:rgba(0,0,0,.18);padding:4px 10px;border-radius:999px}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{position:relative;border-radius:16px;background:#3d7a2e;box-shadow:0 0 0 5px #fff6,0 10px 24px rgba(0,0,0,.3);overflow:hidden;touch-action:none}
#cells,#tiles,#fx{position:absolute;inset:0}
#fx{pointer-events:none;z-index:4}
.cell{position:absolute}
.cell.dk{background:rgba(0,0,0,.07)}
.dirt{position:absolute;border-radius:22%;background:radial-gradient(circle at 30% 30%,#9a6a42,#7a4f2c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.dirt.d2{background:radial-gradient(circle at 30% 30%,#6e4526,#4e2f18)}
.dirt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 70%,rgba(255,255,255,.18) 2px,transparent 3px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.15) 2px,transparent 3px),radial-gradient(circle at 60% 75%,rgba(0,0,0,.2) 2px,transparent 3px)}
.dirt.gone{animation:dirtgone .35s forwards}
@keyframes dirtgone{to{transform:scale(1.4);opacity:0}}
.tile{position:absolute;left:0;top:0;transition:transform .26s cubic-bezier(.35,1.3,.6,1);will-change:transform}
.face{position:absolute;inset:7%;border-radius:24%;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 3px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.7)}
.face span{line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2));display:block}
.tile.sp .face{background:radial-gradient(circle at 35% 30%,#fffef5,#ffe9a8)!important;border-color:#fff;box-shadow:0 0 0 2px #ffcf3a,0 3px 6px rgba(0,0,0,.3)}
.tile.sp-rainbow .face{background:conic-gradient(#ff6b6b,#ffd93b,#6bdc6b,#4cc3ff,#b07cff,#ff6b6b)!important}
.tile.sp-h .face span{transform:rotate(45deg)}
.tile.sp-v .face span{transform:rotate(-45deg)}
.tile.sp .face{animation:shine 1.2s ease-in-out infinite alternate}
@keyframes shine{to{filter:brightness(1.15)}}
.tile.sel .face{transform:scale(1.12);box-shadow:0 0 0 4px #fff,0 6px 12px rgba(0,0,0,.35)}
.tile.hint .face{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
.tile.pop .face{animation:popout .22s ease-in forwards}
@keyframes popout{40%{transform:scale(1.25)}to{transform:scale(0);opacity:0}}
.tile.newsp .face{animation:newsp .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes newsp{from{transform:scale(.2)}}
.beam{position:absolute;background:linear-gradient(90deg,transparent,#fff 20%,#ffe066 50%,#fff 80%,transparent);border-radius:8px;animation:beam .38s ease-out forwards;box-shadow:0 0 14px #ffe066}
.beam.v{background:linear-gradient(transparent,#fff 20%,#ffe066 50%,#fff 80%,transparent)}
@keyframes beam{from{opacity:1}to{opacity:0}}
.beam.h{animation:beamh .38s ease-out forwards}.beam.v{animation:beamv .38s ease-out forwards}
@keyframes beamh{from{transform:scaleX(.1)}60%{opacity:1}to{transform:scaleX(1);opacity:0}}
@keyframes beamv{from{transform:scaleY(.1)}60%{opacity:1}to{transform:scaleY(1);opacity:0}}
.ring{position:absolute;border-radius:50%;border:6px solid #ffb01a;background:radial-gradient(#fff8,#ffd84a44);animation:ring .4s ease-out forwards}
@keyframes ring{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}
.flyer{position:absolute;font-size:30px;transition:transform .42s cubic-bezier(.5,0,.5,1);z-index:6}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.footer{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
.mini{width:58px;height:58px;border-radius:50%;background:#fff8e8;border:3px solid #fff;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none}
.mini svg{width:100%;height:100%}
.mini.fio{background:#ffe9b8}
.crew{display:flex;gap:4px;align-items:flex-end;position:relative}
.bubble{position:absolute;bottom:66px;left:0;background:#fff;border-radius:16px;padding:8px 12px;font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);opacity:0;transform:translateY(8px) scale(.9);transition:.2s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;bottom:-8px;left:var(--tail,24px);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.tools{display:flex;gap:8px}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(40,30,10,.85);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:17px;z-index:40;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;max-width:86%}
.toast.on{opacity:1}
.combo{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;color:#fff;text-shadow:0 4px 0 #c27a00,0 0 20px #ffb01a;pointer-events:none;z-index:8;animation:combo .9s ease-out forwards;white-space:nowrap}
@keyframes combo{from{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}to{transform:translate(-50%,-90%) scale(1);opacity:0}}
.stars-earn{font-size:44px;font-weight:900;color:#f5a623;text-shadow:0 3px 0 #c27a00;margin:8px 0}

.love{margin-top:10px;text-align:center;color:#fff;font-size:20px;font-weight:800;font-style:italic;text-shadow:0 2px 0 rgba(46,122,34,.8),0 4px 14px rgba(0,0,0,.25)}
.love .heart{display:inline-block;font-style:normal;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
</style>
</head>
<body>
<div id="title" class="screen on">
  <h1>Fiota<span>Scapes</span></h1>
  <div class="trio">
    <div class="pt fio" id="tFio"></div>
    <div class="pt big bounce" id="tMari"></div>
    <div class="pt" id="tEu"></div>
  </div>
  <div class="sub">Um presente do Nino pra Mari 💚<br><span style="font-weight:600;opacity:.85;font-size:14px">Combine, ganhe estrelas e reforme o jardim. Jogadas infinitas.</span></div>
  <button class="btn green" id="startB" style="font-size:24px;padding:16px 46px">Iniciar</button>
  <div class="love">te amo infinitamente mais <span class="heart">❤️</span></div>
</div>

<div id="garden" class="screen">
  <div class="topbar">
    <div class="pill"><span class="ic">⭐</span><span id="gStars">0</span></div>
    <div class="grow"></div>
    <button class="btn round gray" id="setB">⚙️</button>
  </div>
  <div id="scene"></div>
  <div class="bottombar">
    <div class="side"><button class="btn round blue relative" id="taskB">📋<span class="badge" id="taskBadge">0</span></button>Tarefas</div>
    <button class="btn green play" id="playBtn">▶ Fase 1</button>
    <div class="side"><button class="btn round relative" id="shopB">🐾</button>Mimos</div>
  </div>
</div>

<div id="game" class="screen">
  <div class="hud">
    <button class="btn round gray" id="backB">🏡</button>
    <div class="goals" id="goals"></div>
    <div class="lvl">FASE<b id="lvlN">1</b></div>
  </div>
  <div class="infobar"><span>Jogadas: <b id="movesN">0</b></span><span id="parN"></span></div>
  <div id="boardWrap"><div id="board"><div id="cells"></div><div id="tiles"></div><div id="fx"></div></div></div>
  <div class="footer">
    <div class="crew">
      <div class="bubble" id="bubble"></div>
      <div class="mini" id="miniMari"></div>
      <div class="mini" id="miniEu"></div>
      <div class="mini fio" id="miniFio"></div>
    </div>
    <div class="tools">
      <button class="btn round blue" id="hintB" title="Dica">💡</button>
      <button class="btn round gray" id="shufB" title="Embaralhar">🔀</button>
    </div>
  </div>
</div>

<div id="dialog"></div>
<div id="modal" class="overlay"></div>
<div id="toast" class="toast"></div>
<script>// ===== PERSONAGENS =====
function svgWrap(inner, vb = '0 0 200 200') {
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function euArt(o = {}) {
  const skin = '#c68d68', beard = '#2b211c';
  let s = '';
  s += `<path d="M22,200 Q28,152 100,146 Q172,152 178,200Z" fill="#1f1f22"/>`;
  s += `<path d="M80,151 Q100,164 120,151" stroke="#3a3a3e" fill="none" stroke-width="4"/>`;
  s += `<rect x="86" y="124" width="28" height="28" fill="#b57c58"/>`;
  s += `<ellipse cx="58" cy="98" rx="8" ry="11" fill="${skin}"/><ellipse cx="142" cy="98" rx="8" ry="11" fill="${skin}"/>`;
  s += `<circle cx="57" cy="107" r="5" fill="#111"/><circle cx="57" cy="107" r="2" fill="${skin}"/>`;
  s += `<ellipse cx="100" cy="92" rx="42" ry="50" fill="${skin}"/>`;
  if (o.shades) s += `<ellipse cx="88" cy="56" rx="22" ry="9" fill="#fff" opacity=".18"/>`;
  s += `<path d="M58,84 C55,130 70,162 100,168 C130,162 145,130 142,84 C139,103 133,115 123,118 C112,111 88,111 77,118 C67,115 61,103 58,84Z" fill="${beard}"/>`;
  s += `<path d="M82,119 Q100,107 118,119 Q109,124 100,120 Q91,124 82,119Z" fill="${beard}"/>`;
  s += `<path d="M91,125 Q100,131 109,125" stroke="#6e3326" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M78,140 q4,10 2,18 M120,137 q-3,10 0,19 M100,151 v11 M69,124 q2,8 6,14 M131,124 q-2,8 -6,14" stroke="#a09a94" stroke-width="2.2" fill="none" opacity=".75" stroke-linecap="round"/>`;
  s += `<path d="M100,90 Q95,105 97,110 Q102,113 106,109" stroke="#9c6446" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  if (o.shades) {
    s += `<path d="M58,90 L70,90 M130,90 L142,90" stroke="#222" stroke-width="3"/>`;

let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .12, type = 'sine', vol = .15, delay = 0, slide = 0) {
  if (!S.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}

      el.style.transition = 'none'; el.style.transform = cellXY(t.from != null ? t.from : r, c); el.offsetWidth; el.style.transition = '';
      delete t.from;
    }
    const sig = (t.sp || '') + t.color;
    if (el._sig !== sig) { paint(el, t); el._sig = sig; }
    if (t.newsp) { el.classList.add('newsp'); delete t.newsp; setTimeout(() => el.classList.remove('newsp'), 400); }
    const tr = cellXY(r, c); if (el._tr !== tr) { el.style.transform = tr; el._tr = tr; }
    seen.add(t.id);
  }
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
}
function renderCells() {
  let h = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    h += `<div class="cell ${(r + c) % 2 ? 'dk' : ''}" style="left:${c * T}px;top:${r * T}px;width:${T}px;height:${T}px"></div>`;
    const d = G.dirt[r][c]; if (d) h += `<div class="dirt d${d}" data-k="${r * COLS + c}" style="left:${c * T + 1}px;top:${r * T + 1}px;width:${T - 2}px;height:${T - 2}px"></div>`;
  }
  $('#cells').innerHTML = h;
}
function goalIcon(g) { return g.t === 'c' ? `<div class="gi" style="background:${TILE[g.c].bg}">${TILE[g.c].e}</div>` : `<div class="gi" style="background:radial-gradient(circle at 30% 30%,#9a6a42,#7a4f2c);font-size:18px">🌱</div>`; }
function renderHUD() {
  $('#goals').innerHTML = G.goals.map((g, i) => `<div class="goal ${g.left <= 0 ? 'ok' : ''}" data-g="${i}">${goalIcon(g)}<span>${g.left <= 0 ? '✓' : g.left}</span></div>`).join('');
  $('#lvlN').textContent = G.n;
  $('#movesN').textContent = G.moves;
  $('#parN').textContent = G.moves <= G.par ? `⭐ bônus: até ${G.par} jogadas` : `jogadas ∞ — sem pressa 💚`;
}
function bumpGoal(i) { const e = document.querySelector(`[data-g="${i}"]`); if (e) { e.classList.add('hit'); setTimeout(() => e.classList.remove('hit'), 150); } }
function layout() {
  const wrap = $('#boardWrap'); const w = wrap.clientWidth - 16, h = wrap.clientHeight - 12;
  T = Math.max(30, Math.floor(Math.min(w, h, 560) / 8));
  const b = $('#board'); b.style.width = b.style.height = (T * 8) + 'px';
  if (G) {
    renderCells();
    for (const el of els.values()) { el.style.width = el.style.height = T + 'px'; el.firstChild.firstChild.style.fontSize = (T * .58) + 'px'; el._tr = ''; }
    sync();
  }
}
window.addEventListener('resize', () => { if ($('#game').classList.contains('on')) layout(); });

// ---- efeitos ----
function fxEl(cls, css, txt) { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); if (txt) d.textContent = txt; $('#fx').appendChild(d); setTimeout(() => d.remove(), 700); return d; }
function showFx(a) {
  const W = T * 8;
  const beam = (dir, r, c) => dir === 'h' ? fxEl('beam h', { left: 0, top: (r * T + T / 2 - T * .22) + 'px', width: W + 'px', height: T * .44 + 'px' }) : fxEl('beam v', { top: 0, left: (c * T + T / 2 - T * .22) + 'px', height: W + 'px', width: T * .44 + 'px' });
  const ring = (r, c, rad) => fxEl('ring', { left: (c * T + T / 2 - rad * T) + 'px', top: (r * T + T / 2 - rad * T) + 'px', width: rad * 2 * T + 'px', height: rad * 2 * T + 'px' });
  switch (a.sp) {
    case 'h': beam('h', a.r); sfx.zap(); break;
    case 'v': beam('v', 0, a.c); sfx.zap(); break;
    case 'cross': beam('h', a.r); beam('v', 0, a.c); sfx.zap(); break;
    case 'bigcross': for (let d = -1; d <= 1; d++) { beam('h', a.r + d); beam('v', 0, a.c + d); } sfx.boom(); break;
    case 'bomb': ring(a.r, a.c, 2.6); sfx.boom(); break;
    case 'bigbomb': ring(a.r, a.c, 4.2); sfx.boom(); break;
    case 'all': fxEl('flash', {}); sfx.boom(); break;
    case 'rainbow': case 'convert': ring(a.r, a.c, 1.5); sfx.zap(); (a.targets || []).forEach(([y, x]) => { const t = G.grid[y][x]; const el = t && els.get(t.id); if (el) el.classList.add('hint'); }); break;
    case 'fly': {
      ring(a.r, a.c, 1.2);
      const f = fxEl('flyer', { left: 0, top: 0, width: T + 'px', height: T + 'px', display: 'grid', placeItems: 'center', fontSize: T * .7 + 'px' }, '🦋');
      f.style.transform = cellXY(a.r, a.c); f.offsetWidth; requestAnimationFrame(() => f.style.transform = cellXY(a.tr, a.tc) + ' scale(1.3)');
      sfx.zap(); break;
    }
  }
}
function comboText(txt) { const d = document.createElement('div'); d.className = 'combo'; d.textContent = txt; $('#boardWrap').appendChild(d); setTimeout(() => d.remove(), 950); }
let bubT, lastReact = 0;
function react(force) {
  const now = Date.now(); if (!force && now - lastReact < 2500) return; lastReact = now;
  const opts = [['fiota', 'Au au! 🐾', 150], ['mari', 'Isso! ✨', 20], ['eucool', 'Arrasou, Mari! 😎', 85], ['fiota', '(abanando o rabo) 🐕', 150], ['mari', 'Uhul! 💚', 20], ['eucool', 'Que jogada, amor! 🔥', 85]];
  const [who, txt, tail] = opts[Math.random() * opts.length | 0];
  const b = $('#bubble'); b.textContent = txt; b.style.setProperty('--tail', tail + 'px'); b.classList.add('on');
  $('#miniEu').innerHTML = portrait(who === 'eucool' ? 'eucool' : 'eu');
  if (who === 'fiota') sfx.bark();
  clearTimeout(bubT); bubT = setTimeout(() => { b.classList.remove('on'); $('#miniEu').innerHTML = portrait('eu'); }, 1600);
}

// ---- fluxo das jogadas ----
let sel = null, hintT = null;
function count(t, r, c) {
  if (t) { const col = t.sp ? (t.keep != null ? t.keep : -1) : t.color; G.goals.forEach((g, i) => { if (g.t === 'c' && g.c === col && g.left > 0) { g.left--; bumpGoal(i); } }); }
  if (G.dirt[r][c] > 0) {
    G.dirt[r][c]--; G.goals.forEach((g, i) => { if (g.t === 'd' && g.left > 0) { g.left--; bumpGoal(i); } });
    const d = document.querySelector(`.dirt[data-k="${r * COLS + c}"]`);
    if (d) { if (G.dirt[r][c] === 0) { d.classList.add('gone'); setTimeout(() => d.remove(), 360); } else d.className = 'dirt d1'; }
  }
}
async function blastAndClear(start, acts, protect = new Set(), spawns = [], chain = 1) {
  const { cleared, fx } = resolve(start, acts, protect);
  if (fx.some(a => a.converted)) { sync(); await sleep(380); }
  fx.forEach(showFx);
  if (fx.length) await sleep(fx.some(a => a.sp === 'fly') ? 430 : fx.some(a => a.sp === 'rainbow') ? 320 : 200);
  for (const t of cleared.values()) if (t) { const el = els.get(t.id); if (el) el.classList.add('pop'); }
  for (const g of spawns) { const [r, c] = g.spawn; const t = G.grid[r][c]; count(t, r, c); t.color = -1; t.sp = g.sp; t.newsp = true; }
  for (const [k, t] of cleared) { const r = Math.floor(k / COLS), c = k % COLS; count(t, r, c); G.grid[r][c] = null; }
  if (!fx.length) sfx.pop(chain);
  renderHUD();
  await sleep(210);
  sync();
  gravity(); sync();
  await sleep(300);
}
function gravity() {
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) { const t = G.grid[r][c]; if (t) { if (r !== w) { G.grid[w][c] = t; G.grid[r][c] = null; } w--; } }
    const n = w + 1;
    for (let r = w; r >= 0; r--) { const t = newTile(randColor()); t.from = r - n; G.grid[r][c] = t; }
  }
}
async function cascade(swapCells) {
  let chain = 0;
  for (; ;) {
    const groups = findGroups(swapCells); swapCells = [];
    if (!groups.length) break;
    chain++;
    const protect = new Set(), start = [];
    groups.forEach(g => { g.cells.forEach(p => start.push(p)); if (g.sp) protect.add(g.spawn[0] * COLS + g.spawn[1]); });
    if (groups.some(g => g.sp)) react();
    await blastAndClear(start, [], protect, groups.filter(g => g.sp), chain);
    if (chain === 3) comboText('Incrível!'); if (chain === 5) { comboText('Espetacular!'); react(true); }
  }
}
function goalsDone() { return G.goals.every(g => g.left <= 0); }
async function endTurn() {
  if (goalsDone()) { G.won = true; G.busy = true; await sleep(350); return levelComplete(); }
  let n = 0; while (!findMove() && n++ < 10) await shuffle();
  G.busy = false; scheduleHint();
}
async function shuffle() {
  toast('Sem jogadas — embaralhando! 🔀', 1200);
  const pos = [], tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = G.grid[r][c]; if (t && !t.sp) { pos.push([r, c]); tiles.push(t); } }
  for (let tries = 0; tries < 60; tries++) {
    tiles.sort(() => Math.random() - .5); pos.forEach(([r, c], i) => G.grid[r][c] = tiles[i]);
    let bad = false; for (const [r, c] of pos) if (matchAt(r, c)) { bad = true; break; }
    if (!bad && findMove()) break;
    if (tries === 59) tiles.forEach(t => t.color = randColor());
  }
  await sleep(400); sync(); await sleep(400);
}
function clearHint() { clearTimeout(hintT); document.querySelectorAll('.tile.hint').forEach(e => e.classList.remove('hint')); }
function scheduleHint() {
  clearHint();
  hintT = setTimeout(() => { if (!G || G.busy) return; const m = findMove(); if (!m) return; [m.a, m.b].forEach(p => { if (!p) return; const el = els.get(at(p).id); if (el) el.classList.add('hint'); }); }, 6000);
}
function setSel(p) {
  document.querySelectorAll('.tile.sel').forEach(e => e.classList.remove('sel'));
  sel = p; if (p) { const el = els.get(at(p).id); if (el) el.classList.add('sel'); }
}
async function trySwap(a, b) {
  if (!G || G.busy || G.won) return;
  const ta = at(a), tb = at(b); if (!ta || !tb) return;
  G.busy = true; clearHint(); setSel(null);
  swapGrid(a, b); sync(); sfx.swap(); await sleep(170);
  if (ta.sp || tb.sp) {
    G.moves++; renderHUD();
    await specialSwap(ta, b, tb, a);
  } else if (matchAt(a[0], a[1]) || matchAt(b[0], b[1])) {
    G.moves++; renderHUD();
  } else {
    swapGrid(a, b); sync(); sfx.bad(); await sleep(200); G.busy = false; scheduleHint(); return;
  }
  await cascade([a, b]);
  await endTurn();
}
async function specialSwap(t1, p1, t2, p2) {
  if (t1.sp && t2.sp) {
    const ty = [t1.sp, t2.sp]; const has = x => ty.includes(x); const rk = x => x === 'h' || x === 'v';
    t1.fired = t2.fired = true; const [r, c] = p1; let acts;
    if (has('rainbow') && ty[0] === ty[1]) acts = [{ r, c, sp: 'all' }];
    else if (has('rainbow')) { const o = ty.find(x => x !== 'rainbow'); acts = [{ r, c, sp: 'convert', to: rk(o) ? 'rocket' : o }]; }
    else if (has('fly') && ty[0] === ty[1]) acts = [{ r, c, sp: 'fly' }, { r, c, sp: 'fly' }, { r, c, sp: 'fly' }];
    else if (has('fly')) { const o = ty.find(x => x !== 'fly'); acts = [{ r, c, sp: 'fly', carry: o }]; }
    else if (ty[0] === 'bomb' && ty[1] === 'bomb') acts = [{ r, c, sp: 'bigbomb' }];
    else if (has('bomb')) acts = [{ r, c, sp: 'bigcross' }];
    else acts = [{ r, c, sp: 'cross' }];
    comboText('Combo! 💥'); react(true);
    await blastAndClear([p1, p2], acts);
  } else {
    const [s, sp, n] = t1.sp ? [t1, p1, t2] : [t2, p2, t1];
    if (s.sp === 'rainbow') { s.fired = true; await blastAndClear([sp], [{ r: sp[0], c: sp[1], sp: 'rainbow', color: n.color }]); }
    else await blastAndClear([sp], []);
  }
}
async function tapSpecial(p) {
  if (!G || G.busy || G.won) return;
  G.busy = true; clearHint(); setSel(null); G.moves++; renderHUD();
  await blastAndClear([p], []);
  await cascade([]);
  await endTurn();
}
let drag = null;
function cellFromEvent(e) { const r = $('#board').getBoundingClientRect(); const c = Math.floor((e.clientX - r.left) / T), y = Math.floor((e.clientY - r.top) / T); return inB(y, c) ? [y, c] : null; }
$('#board').addEventListener('pointerdown', e => {
  e.preventDefault(); ac();
  if (!G || G.busy || G.won) return; const p = cellFromEvent(e); if (!p) return;
  drag = { p, x: e.clientX, y: e.clientY, moved: false };
  try { $('#board').setPointerCapture(e.pointerId); } catch (_) { }
});
$('#board').addEventListener('pointermove', e => {
  if (!drag || drag.moved) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < T * .3) return;
  drag.moved = true; const [r, c] = drag.p; const q = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
  if (inB(q[0], q[1])) trySwap(drag.p, q);
});
$('#board').addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null; if (d.moved || !G || G.busy) return;
  const p = d.p;
  if (sel && Math.abs(sel[0] - p[0]) + Math.abs(sel[1] - p[1]) === 1) return trySwap(sel, p);
  if (sel && sel[0] === p[0] && sel[1] === p[1]) return setSel(null);
  if (at(p).sp) return tapSpecial(p);
  setSel(p); sfx.click();
});
$('#board').addEventListener('pointercancel', () => drag = null);

// ---- iniciar / concluir fase ----
function startLevel() {
  const L = makeLevel(S.level);
  for (const el of els.values()) el.remove(); els.clear(); $('#fx').innerHTML = '';
  G = { n: L.n, nc: L.nc, dirt: L.dirt, par: L.par, moves: 0, busy: false, won: false, goals: L.goals.map(g => Object.assign({ left: g.n }, g)), grid: null };
  fillBoard();
  show('game'); $('#miniEu').innerHTML = portrait('eu'); $('#miniMari').innerHTML = portrait('mari'); $('#miniFio').innerHTML = portrait('fiota');
  layout(); renderHUD();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) G.grid[r][c].from = r - ROWS - 1;
  sync(); scheduleHint();
  const desc = G.goals.map(g => g.t === 'c' ? `${g.n} ${TILE[g.c].e}` : `limpar ${g.n} 🌱 de terra`).join(' + ');
  toast(`Fase ${G.n}: ${desc}`, 2200);
}
async function levelComplete() {
  clearHint(); sfx.win();
  const bonus = G.moves <= G.par ? 1 : 0; const earned = 1 + bonus;
  S.stars += earned; S.level++; save();
  comboText('Fase concluída!');
  await sleep(900);
  $('#modal').dataset.lock = '1';
  const c = modal(`<h2>Fase ${G.n} concluída! 🎉</h2><div class="trio"><div class="pt" style="width:84px;height:84px">${portrait('fiota')}</div><div class="pt big bounce" style="width:104px;height:104px">${portrait('mari')}</div><div class="pt" style="width:84px;height:84px">${portrait('eucool')}</div></div>
  <div class="stars-earn">+${earned} ⭐</div><p>${G.moves} jogadas${bonus ? ' — <b>bônus de rapidez!</b>' : ''}</p><p class="small-note" style="text-align:center">Total: ${S.stars} ⭐</p>
  <div class="row"><button class="btn green" id="toG">🏡 Jardim</button><button class="btn" id="nxL">Fase ${S.level} ▶</button></div>`);
  setTimeout(sfx.star, 300); if (bonus) setTimeout(sfx.star, 550);
  c.querySelector('#toG').onclick = () => { $('#modal').dataset.lock = ''; closeModal(); G = null; goGarden(); };
  c.querySelector('#nxL').onclick = () => { $('#modal').dataset.lock = ''; closeModal(); startLevel(); };
}
function goGarden() { show('garden'); renderGarden(); }
$('#backB').onclick = () => {
  if (!G) return goGarden();
  const c = modal(`<h2>Sair da fase?</h2><p>Não perde nada — você pode jogar essa fase de novo quando quiser.</p><div class="row"><button class="btn small" id="y">Sair</button><button class="btn small green" id="n">Continuar jogando</button></div>`);
  c.querySelector('#y').onclick = () => { closeModal(); clearHint(); G = null; goGarden(); };
  c.querySelector('#n').onclick = closeModal;
};
$('#hintB').onclick = () => { if (!G || G.busy) return; const m = findMove(); clearHint(); if (m) [m.a, m.b].forEach(p => { if (p) { const el = els.get(at(p).id); if (el) el.classList.add('hint'); } }); };
$('#shufB').onclick = async () => { if (!G || G.busy || G.won) return; G.busy = true; clearHint(); setSel(null); await shuffle(); G.busy = false; scheduleHint(); };
$('#miniFio').onclick = () => { sfx.bark(); const b = $('#bubble'); b.textContent = 'Au! 🐾'; b.style.setProperty('--tail', '150px'); b.classList.add('on'); clearTimeout(bubT); bubT = setTimeout(() => b.classList.remove('on'), 1000); };

// ===== INÍCIO =====
$('#playBtn').onclick = () => { sfx.click(); startLevel(); };
$('#taskB').onclick = () => { sfx.click(); openTasks(); };
$('#shopB').onclick = () => { sfx.click(); openShop(); };
$('#setB').onclick = () => { sfx.click(); openSettings(); };
$('#tEu').innerHTML = portrait('eu'); $('#tMari').innerHTML = portrait('mari'); $('#tFio').innerHTML = portrait('fiota');
$('#startB').onclick = async () => {
  ac(); sfx.click();
  goGarden();
  if (!S.intro) { await intro(); renderGarden(); }
};
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.__dbg = { get G() { return G; }, S: () => S, findMove, trySwap, tapSpecial, startLevel, goGarden, openTask, save, renderGarden };
</script>
